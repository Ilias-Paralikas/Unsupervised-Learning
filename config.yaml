models:
  channels: [512, 512, 256, 128, 64, 32, 16]
  z_dim: 256
  generator:
    block_depth: 2
    residual: true
    use_norm: true
  discriminator:
    block_depth: 2
    residual: true
    use_norm: false
  encoder:
    block_depth: 2
    residual: true
    use_norm: true
training:
  batch_size: 16
  encoder:
    enc_lr: 0.001
    enc_rec_scale: 40.0
    enc_latent_scale: 0.001
    enc_feature_scale: 100.0
  generator:
    gen_lr: 0.001
  discriminator:
    disc_lr: 0.001
    disc_drift_scale: 0.01
    disc_gp_scale: 10.0
  save_itter: 200
